# Public extension commands.

[commands.host_list]
path = ["host", "list"]
workflow = "host_list"
about = "List Hosts"
examples = ["extension placement host list"]

[commands.host_show]
path = ["host", "show"]
workflow = "host_show"
about = "Show a Host and its related placement objects"
examples = ["extension placement host show server-01"]

[commands.host_show.options.name]
kind = "string"
position = 1
required = true
help = "Exact Host name"

[commands.host_create]
path = ["host", "create"]
workflow = "host_create"
about = "Create a Host in the configured inventory collection"
examples = ["extension placement host create server-01 --data '{\"facts\":{}}'"]

[commands.host_create.options.name]
kind = "string"
position = 1
required = true
help = "Host name"

[commands.host_create.options.description]
kind = "string"
long = "description"
help = "Host description"

[commands.host_create.options.data]
kind = "json"
long = "data"
help = "Host data as JSON"

[commands.host_placement]
path = ["host", "placement"]
workflow = "host_placement"
about = "Show the Jacks and Rooms containing a Host"
examples = ["extension placement host placement server-01"]

[commands.host_placement.options.host]
kind = "string"
position = 1
required = true
help = "Exact Host name"

[commands.host_connect_jack]
path = ["host", "connect-jack"]
workflow = "host_connect_jack"
about = "Relate a Host to a Jack"
examples = ["extension placement host connect-jack server-01 J-42"]

[commands.host_connect_jack.options.host]
kind = "string"
position = 1
required = true
help = "Exact Host name"

[commands.host_connect_jack.options.jack]
kind = "string"
position = 2
required = true
help = "Exact Jack name"

[commands.host_disconnect_jack]
path = ["host", "disconnect-jack"]
workflow = "host_disconnect_jack"
about = "Remove a Host-to-Jack relation"
examples = ["extension placement host disconnect-jack server-01 J-42"]

[commands.host_disconnect_jack.options.host]
kind = "string"
position = 1
required = true
help = "Exact Host name"

[commands.host_disconnect_jack.options.jack]
kind = "string"
position = 2
required = true
help = "Exact Jack name"

[commands.host_move]
path = ["host", "move"]
workflow = "host_move"
about = "Preview or apply moving a Host to one Jack"
long_about = "List the Host's current Jacks, remove those relations, and add the requested Jack relation. The default is a read-only preview; pass --apply to mutate."
examples = [
  "extension placement host move server-01 J-42",
  "extension placement host move server-01 J-42 --apply",
]

[commands.host_move.options.host]
kind = "string"
position = 1
required = true
help = "Exact Host name"

[commands.host_move.options.jack]
kind = "string"
position = 2
required = true
help = "Exact target Jack name"

[commands.host_move.options.apply]
kind = "flag"
long = "apply"
help = "Apply the relation changes; otherwise return only the plan"

[commands.jack_list]
path = ["jack", "list"]
workflow = "jack_list"
about = "List Jacks"
examples = ["extension placement jack list"]

[commands.jack_show]
path = ["jack", "show"]
workflow = "jack_show"
about = "Show a Jack and its related placement objects"
examples = ["extension placement jack show J-42"]

[commands.jack_show.options.name]
kind = "string"
position = 1
required = true
help = "Exact Jack name"

[commands.jack_create]
path = ["jack", "create"]
workflow = "jack_create"
about = "Create a Jack in the configured inventory collection"
examples = ["extension placement jack create J-42"]

[commands.jack_create.options.name]
kind = "string"
position = 1
required = true
help = "Jack name"

[commands.jack_create.options.description]
kind = "string"
long = "description"
help = "Jack description"

[commands.jack_create.options.data]
kind = "json"
long = "data"
help = "Jack data as JSON"

[commands.jack_hosts]
path = ["jack", "hosts"]
workflow = "jack_hosts"
about = "List Hosts related to a Jack"
examples = ["extension placement jack hosts J-42"]

[commands.jack_hosts.options.jack]
kind = "string"
position = 1
required = true
help = "Exact Jack name"

[commands.jack_rooms]
path = ["jack", "rooms"]
workflow = "jack_rooms"
about = "List Rooms related to a Jack"
examples = ["extension placement jack rooms J-42"]

[commands.jack_rooms.options.jack]
