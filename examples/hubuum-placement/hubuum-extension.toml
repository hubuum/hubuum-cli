# Public extension commands.

[[commands]]
path = ["host", "list"]
workflow = "host_list"
about = "List Hosts"
examples = ["extension placement host list"]

[[commands]]
path = ["host", "show"]
workflow = "host_show"
about = "Show a Host and its related placement objects"
examples = ["extension placement host show server-01"]

[[commands.options]]
name = "name"
kind = "string"
positional = true
required = true
help = "Exact Host name"

[[commands]]
