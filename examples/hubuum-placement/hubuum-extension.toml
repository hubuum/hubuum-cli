schema_version = 1
kind = "portable"
name = "placement"
version = "0.1.0"
requires_cli = ">=0.0.9,<0.1.0"

[config.hosts_class]
type = "string"
default = "Hosts"
help = "Class containing Host objects"

[config.jacks_class]
type = "string"
default = "Jacks"
help = "Class containing Jack objects"

[config.rooms_class]
type = "string"
default = "Rooms"
help = "Class containing Room objects"

[config.inventory_collection]
type = "string"
default = "inventory"
help = "Collection used when creating placement objects"

[config.relation_depth]
type = "integer"
default = 1
help = "Traversal depth used for direct placement lookups"

# Private reusable object workflows.

[workflows.list_objects]
step_order = [
  "objects",
]
result = "if (.steps.objects | type) == \"array\" then .steps.objects else .steps.objects.items end"

[workflows.list_objects.inputs.class]
type = "string"
required = true

[workflows.list_objects.output]
shape = "rows"
type = "json"

[workflows.list_objects.steps.objects]
kind = "run"
run = ["object", "list"]

[workflows.list_objects.steps.objects.with]
class = { input = "class" }
all = true

[workflows.show_object]
step_order = [
  "object",
]
result = ".steps.object"

[workflows.show_object.inputs.class]
type = "string"
required = true

[workflows.show_object.inputs.name]
type = "string"
required = true

[workflows.show_object.output]
shape = "detail"
type = "json"

[workflows.show_object.steps.object]
kind = "run"
run = ["object", "show"]

[workflows.show_object.steps.object.with]
class = { input = "class" }
name = { input = "name" }
max-depth = { config = "relation_depth" }

[workflows.create_object]
step_order = [
  "object",
]
capabilities = ["mutate"]
result = ".steps.object"

[workflows.create_object.inputs.class]
type = "string"
required = true

[workflows.create_object.inputs.name]
type = "string"
required = true

[workflows.create_object.inputs.description]
type = "string"
required = true

[workflows.create_object.inputs.data]
type = "json"
required = true

[workflows.create_object.output]
shape = "detail"
type = "json"

[workflows.create_object.steps.object]
kind = "run"
run = ["object", "create"]

[workflows.create_object.steps.object.with]
class = { input = "class" }
name = { input = "name" }
collection = { config = "inventory_collection" }
description = { input = "description" }
data = { input = "data" }

[workflows.related_objects]
step_order = [
  "ignored_classes",
  "related",
]
result = "if (.steps.related | type) == \"array\" then .steps.related else .steps.related.items end"

[workflows.related_objects.inputs.root_class]
type = "string"
required = true

[workflows.related_objects.inputs.root_object]
type = "string"
required = true

[workflows.related_objects.inputs.ignore_a]
type = "string"

[workflows.related_objects.inputs.ignore_b]
type = "string"

[workflows.related_objects.output]
shape = "rows"
type = "json"

[workflows.related_objects.steps.ignored_classes]
kind = "let"
expr = "[.input.ignore_a, .input.ignore_b] | map(select(. != null))"

[workflows.related_objects.steps.related]
kind = "run"
run = ["relation", "object", "list"]

[workflows.related_objects.steps.related.with]
root-class = { input = "root_class" }
root-object = { input = "root_object" }
max-depth = { config = "relation_depth" }
ignore-class = { step = "ignored_classes" }
all = true

[workflows.link_objects]
step_order = [
  "relation",
]
capabilities = ["mutate"]
result = ".steps.relation"

[workflows.link_objects.inputs.class_a]
type = "string"
required = true

[workflows.link_objects.inputs.object_a]
type = "string"
required = true

[workflows.link_objects.inputs.class_b]
type = "string"
required = true

[workflows.link_objects.inputs.object_b]
type = "string"
required = true

[workflows.link_objects.output]
shape = "detail"
type = "json"

[workflows.link_objects.steps.relation]
kind = "run"
run = ["relation", "object", "create"]

[workflows.link_objects.steps.relation.with]
class-a = { input = "class_a" }
object-a = { input = "object_a" }
class-b = { input = "class_b" }
object-b = { input = "object_b" }

[workflows.unlink_objects]
step_order = [
  "relation",
]
capabilities = ["mutate"]
result = ".steps.relation.message"

[workflows.unlink_objects.inputs.class_a]
type = "string"
required = true

[workflows.unlink_objects.inputs.object_a]
type = "string"
required = true

[workflows.unlink_objects.inputs.class_b]
type = "string"
required = true

[workflows.unlink_objects.inputs.object_b]
type = "string"
required = true

[workflows.unlink_objects.output]
shape = "message"
type = "string"

[workflows.unlink_objects.steps.relation]
kind = "run"
run = ["relation", "object", "delete"]

[workflows.unlink_objects.steps.relation.with]
class-a = { input = "class_a" }
object-a = { input = "object_a" }
class-b = { input = "class_b" }
object-b = { input = "object_b" }

# Host workflows.

[workflows.host_list]
step_order = [
  "objects",
]
result = ".steps.objects"

[workflows.host_list.output]
shape = "rows"
type = "json"

[workflows.host_list.steps.objects]
kind = "call"
call = "list_objects"

[workflows.host_list.steps.objects.with]
class = { config = "hosts_class" }

[workflows.host_show]
step_order = [
  "object",
]
result = ".steps.object"

[workflows.host_show.inputs.name]
type = "string"
required = true

[workflows.host_show.output]
shape = "detail"
type = "json"

[workflows.host_show.steps.object]
kind = "call"
call = "show_object"

[workflows.host_show.steps.object.with]
class = { config = "hosts_class" }
name = { input = "name" }

[workflows.host_create]
step_order = [
  "object",
]
capabilities = ["mutate"]
result = ".steps.object"

[workflows.host_create.inputs.name]
type = "string"
required = true

[workflows.host_create.inputs.description]
type = "string"
default = "Created by the placement extension"

[workflows.host_create.inputs.data]
type = "json"
default = { facts = { schema_version = 1, source = "hubuum-cli-extension" } }

[workflows.host_create.output]
shape = "detail"
type = "json"

[workflows.host_create.steps.object]
kind = "call"
call = "create_object"

[workflows.host_create.steps.object.with]
class = { config = "hosts_class" }
name = { input = "name" }
description = { input = "description" }
data = { input = "data" }

[workflows.host_placement]
step_order = [
  "jacks",
  "jack_names",
  "rooms",
]
result = "{ host: .input.host, jacks: .steps.jacks, rooms_by_jack: ([.steps.jack_names, .steps.rooms] | transpose | map({jack: .[0], rooms: .[1]})) }"

[workflows.host_placement.inputs.host]
type = "string"
required = true

[workflows.host_placement.output]
shape = "detail"
type = "json"
columns = ["host", "jacks", "rooms_by_jack"]

[workflows.host_placement.steps.jacks]
kind = "call"
call = "related_objects"

[workflows.host_placement.steps.jacks.with]
root_class = { config = "hosts_class" }
root_object = { input = "host" }
ignore_a = { config = "rooms_class" }

[workflows.host_placement.steps.jack_names]
kind = "let"
expr = "[.steps.jacks[].name]"

[workflows.host_placement.steps.rooms]
kind = "for_each"
items = { step = "jack_names" }
as = "root_object"
call = "related_objects"
max_items = 100

[workflows.host_placement.steps.rooms.with]
root_class = { config = "jacks_class" }
ignore_a = { config = "hosts_class" }

[workflows.host_connect_jack]
step_order = [
  "relation",
]
capabilities = ["mutate"]
result = ".steps.relation"

[workflows.host_connect_jack.inputs.host]
type = "string"
required = true

[workflows.host_connect_jack.inputs.jack]
type = "string"
required = true

[workflows.host_connect_jack.output]
shape = "detail"
type = "json"

[workflows.host_connect_jack.steps.relation]
kind = "call"
call = "link_objects"

[workflows.host_connect_jack.steps.relation.with]
class_a = { config = "hosts_class" }
object_a = { input = "host" }
class_b = { config = "jacks_class" }
object_b = { input = "jack" }

[workflows.host_disconnect_jack]
step_order = [
  "relation",
]
capabilities = ["mutate"]
result = ".steps.relation"

[workflows.host_disconnect_jack.inputs.host]
type = "string"
required = true

[workflows.host_disconnect_jack.inputs.jack]
type = "string"
required = true

[workflows.host_disconnect_jack.output]
shape = "message"
type = "string"

[workflows.host_disconnect_jack.steps.relation]
kind = "call"
call = "unlink_objects"

[workflows.host_disconnect_jack.steps.relation.with]
class_a = { config = "hosts_class" }
object_a = { input = "host" }
class_b = { config = "jacks_class" }
object_b = { input = "jack" }

[workflows.host_move]
step_order = [
  "current_jacks",
  "valid_names",
  "jack_names",
  "removed",
  "added",
]
capabilities = ["mutate"]
result = "{ host: .input.host, target_jack: .input.jack, previous_jacks: .steps.current_jacks, applied: .input.apply, removals: .steps.removed, addition: .steps.added }"

[workflows.host_move.inputs.host]
type = "string"
required = true

[workflows.host_move.inputs.jack]
type = "string"
required = true

[workflows.host_move.inputs.apply]
type = "boolean"
default = false

[workflows.host_move.output]
shape = "detail"
type = "json"
columns = ["host", "target_jack", "previous_jacks", "applied"]

[workflows.host_move.steps.current_jacks]
kind = "call"
call = "related_objects"

[workflows.host_move.steps.current_jacks.with]
root_class = { config = "hosts_class" }
root_object = { input = "host" }
ignore_a = { config = "rooms_class" }

[workflows.host_move.steps.valid_names]
kind = "assert"
condition = "((.input.host | length) > 0) and ((.input.jack | length) > 0)"
message = "Host and Jack names must not be empty"

[workflows.host_move.steps.jack_names]
kind = "let"
expr = "[.steps.current_jacks[].name]"

[workflows.host_move.steps.removed]
kind = "for_each"
items = { step = "jack_names" }
as = "jack"
call = "host_disconnect_jack"
max_items = 100
when = ".input.apply"

[workflows.host_move.steps.removed.with]
host = { input = "host" }

[workflows.host_move.steps.added]
kind = "call"
call = "host_connect_jack"
when = ".input.apply"

[workflows.host_move.steps.added.with]
host = { input = "host" }
jack = { input = "jack" }

