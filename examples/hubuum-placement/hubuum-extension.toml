schema_version = 1
kind = "portable"
name = "placement"
version = "0.1.0"
requires_cli = ">=0.0.9,<0.1.0"

[config.hosts_class]
type = "string"
default = "Hosts"
help = "Class containing Host objects"

[config.jacks_class]
type = "string"
default = "Jacks"
help = "Class containing Jack objects"

[config.rooms_class]
type = "string"
default = "Rooms"
help = "Class containing Room objects"

[config.inventory_collection]
type = "string"
default = "inventory"
help = "Collection used when creating placement objects"

[config.relation_depth]
type = "integer"
default = 1
help = "Traversal depth used for direct placement lookups"

# Private reusable object workflows.

[workflows.list_objects]
result = "if (.steps.objects | type) == \"array\" then .steps.objects else .steps.objects.items end"

[[workflows.list_objects.inputs]]
name = "class"
type = "string"
required = true

[workflows.list_objects.output]
shape = "rows"
type = "json"

[[workflows.list_objects.steps]]
id = "objects"
kind = "run"
run = ["object", "list"]

[workflows.list_objects.steps.with]
class = { input = "class" }
all = true

[workflows.show_object]
result = ".steps.object"

[[workflows.show_object.inputs]]
name = "class"
type = "string"
required = true

[[workflows.show_object.inputs]]
name = "name"
type = "string"
required = true

[workflows.show_object.output]
shape = "detail"
type = "json"

[[workflows.show_object.steps]]
id = "object"
kind = "run"
run = ["object", "show"]

[workflows.show_object.steps.with]
class = { input = "class" }
name = { input = "name" }
max-depth = { config = "relation_depth" }

[workflows.create_object]
capabilities = ["mutate"]
result = ".steps.object"

[[workflows.create_object.inputs]]
name = "class"
type = "string"
required = true

[[workflows.create_object.inputs]]
name = "name"
type = "string"
required = true

[[workflows.create_object.inputs]]
name = "description"
type = "string"
required = true

[[workflows.create_object.inputs]]
name = "data"
type = "json"
required = true

[workflows.create_object.output]
shape = "detail"
type = "json"

[[workflows.create_object.steps]]
id = "object"
kind = "run"
run = ["object", "create"]

[workflows.create_object.steps.with]
class = { input = "class" }
name = { input = "name" }
collection = { config = "inventory_collection" }
description = { input = "description" }
data = { input = "data" }

[workflows.related_objects]
result = "if (.steps.related | type) == \"array\" then .steps.related else .steps.related.items end"

[[workflows.related_objects.inputs]]
name = "root_class"
type = "string"
required = true

[[workflows.related_objects.inputs]]
name = "root_object"
type = "string"
required = true

[[workflows.related_objects.inputs]]
name = "ignore_a"
type = "string"

[[workflows.related_objects.inputs]]
name = "ignore_b"
type = "string"

[workflows.related_objects.output]
shape = "rows"
type = "json"

[[workflows.related_objects.steps]]
id = "ignored_classes"
kind = "let"
expr = "[.input.ignore_a, .input.ignore_b] | map(select(. != null))"

[[workflows.related_objects.steps]]
id = "related"
kind = "run"
run = ["relation", "object", "list"]

[workflows.related_objects.steps.with]
root-class = { input = "root_class" }
root-object = { input = "root_object" }
max-depth = { config = "relation_depth" }
ignore-class = { step = "ignored_classes" }
all = true

[workflows.link_objects]
capabilities = ["mutate"]
result = ".steps.relation"

[[workflows.link_objects.inputs]]
name = "class_a"
type = "string"
required = true

[[workflows.link_objects.inputs]]
name = "object_a"
type = "string"
required = true

[[workflows.link_objects.inputs]]
name = "class_b"
type = "string"
required = true

[[workflows.link_objects.inputs]]
name = "object_b"
type = "string"
required = true

[workflows.link_objects.output]
shape = "detail"
type = "json"

[[workflows.link_objects.steps]]
id = "relation"
kind = "run"
run = ["relation", "object", "create"]

[workflows.link_objects.steps.with]
class-a = { input = "class_a" }
object-a = { input = "object_a" }
class-b = { input = "class_b" }
object-b = { input = "object_b" }

[workflows.unlink_objects]
capabilities = ["mutate"]
result = ".steps.relation.message"

[[workflows.unlink_objects.inputs]]
name = "class_a"
type = "string"
required = true

[[workflows.unlink_objects.inputs]]
name = "object_a"
type = "string"
required = true

[[workflows.unlink_objects.inputs]]
name = "class_b"
type = "string"
required = true

[[workflows.unlink_objects.inputs]]
name = "object_b"
type = "string"
required = true

[workflows.unlink_objects.output]
shape = "message"
type = "string"

[[workflows.unlink_objects.steps]]
id = "relation"
kind = "run"
run = ["relation", "object", "delete"]

[workflows.unlink_objects.steps.with]
class-a = { input = "class_a" }
object-a = { input = "object_a" }
class-b = { input = "class_b" }
object-b = { input = "object_b" }

# Host workflows.

[workflows.host_list]
result = ".steps.objects"

[workflows.host_list.output]
shape = "rows"
type = "json"

[[workflows.host_list.steps]]
id = "objects"
kind = "call"
call = "list_objects"

[workflows.host_list.steps.with]
class = { config = "hosts_class" }

[workflows.host_show]
result = ".steps.object"

[[workflows.host_show.inputs]]
name = "name"
type = "string"
required = true

[workflows.host_show.output]
shape = "detail"
type = "json"

[[workflows.host_show.steps]]
id = "object"
kind = "call"
call = "show_object"

[workflows.host_show.steps.with]
class = { config = "hosts_class" }
name = { input = "name" }

[workflows.host_create]
capabilities = ["mutate"]
result = ".steps.object"

[[workflows.host_create.inputs]]
name = "name"
type = "string"
required = true

[[workflows.host_create.inputs]]
name = "description"
type = "string"
default = "Created by the placement extension"

[[workflows.host_create.inputs]]
name = "data"
type = "json"
default = { facts = { schema_version = 1, source = "hubuum-cli-extension" } }

[workflows.host_create.output]
shape = "detail"
type = "json"

[[workflows.host_create.steps]]
id = "object"
kind = "call"
call = "create_object"

[workflows.host_create.steps.with]
class = { config = "hosts_class" }
name = { input = "name" }
description = { input = "description" }
data = { input = "data" }

[workflows.host_placement]
result = "{ host: .input.host, jacks: .steps.jacks, rooms_by_jack: ([.steps.jack_names, .steps.rooms] | transpose | map({jack: .[0], rooms: .[1]})) }"

[[workflows.host_placement.inputs]]
name = "host"
type = "string"
required = true

[workflows.host_placement.output]
shape = "detail"
type = "json"
columns = ["host", "jacks", "rooms_by_jack"]

[[workflows.host_placement.steps]]
id = "jacks"
kind = "call"
call = "related_objects"

[workflows.host_placement.steps.with]
root_class = { config = "hosts_class" }
root_object = { input = "host" }
ignore_a = { config = "rooms_class" }

[[workflows.host_placement.steps]]
id = "jack_names"
kind = "let"
expr = "[.steps.jacks[].name]"

[[workflows.host_placement.steps]]
id = "rooms"
kind = "for_each"
items = { step = "jack_names" }
as = "root_object"
call = "related_objects"
max_items = 100

[workflows.host_placement.steps.with]
root_class = { config = "jacks_class" }
ignore_a = { config = "hosts_class" }

[workflows.host_connect_jack]
capabilities = ["mutate"]
result = ".steps.relation"

[[workflows.host_connect_jack.inputs]]
name = "host"
type = "string"
required = true

[[workflows.host_connect_jack.inputs]]
name = "jack"
type = "string"
required = true

[workflows.host_connect_jack.output]
shape = "detail"
type = "json"

[[workflows.host_connect_jack.steps]]
id = "relation"
kind = "call"
call = "link_objects"

[workflows.host_connect_jack.steps.with]
class_a = { config = "hosts_class" }
object_a = { input = "host" }
class_b = { config = "jacks_class" }
object_b = { input = "jack" }

[workflows.host_disconnect_jack]
capabilities = ["mutate"]
result = ".steps.relation"

[[workflows.host_disconnect_jack.inputs]]
name = "host"
type = "string"
required = true

[[workflows.host_disconnect_jack.inputs]]
name = "jack"
type = "string"
required = true

[workflows.host_disconnect_jack.output]
shape = "message"
type = "string"

[[workflows.host_disconnect_jack.steps]]
id = "relation"
kind = "call"
call = "unlink_objects"

[workflows.host_disconnect_jack.steps.with]
class_a = { config = "hosts_class" }
object_a = { input = "host" }
class_b = { config = "jacks_class" }
object_b = { input = "jack" }

[workflows.host_move]
capabilities = ["mutate"]
result = "{ host: .input.host, target_jack: .input.jack, previous_jacks: .steps.current_jacks, applied: .input.apply, removals: .steps.removed, addition: .steps.added }"

[[workflows.host_move.inputs]]
name = "host"
type = "string"
required = true

[[workflows.host_move.inputs]]
name = "jack"
type = "string"
required = true

[[workflows.host_move.inputs]]
name = "apply"
type = "boolean"
default = false

[workflows.host_move.output]
shape = "detail"
type = "json"
columns = ["host", "target_jack", "previous_jacks", "applied"]

[[workflows.host_move.steps]]
id = "current_jacks"
kind = "call"
call = "related_objects"

[workflows.host_move.steps.with]
root_class = { config = "hosts_class" }
root_object = { input = "host" }
ignore_a = { config = "rooms_class" }

[[workflows.host_move.steps]]
id = "valid_names"
kind = "assert"
condition = "((.input.host | length) > 0) and ((.input.jack | length) > 0)"
message = "Host and Jack names must not be empty"

[[workflows.host_move.steps]]
id = "jack_names"
kind = "let"
expr = "[.steps.current_jacks[].name]"

[[workflows.host_move.steps]]
id = "removed"
kind = "for_each"
items = { step = "jack_names" }
as = "jack"
call = "host_disconnect_jack"
max_items = 100
when = ".input.apply"

[workflows.host_move.steps.with]
host = { input = "host" }

[[workflows.host_move.steps]]
id = "added"
kind = "call"
call = "host_connect_jack"
when = ".input.apply"

[workflows.host_move.steps.with]
host = { input = "host" }
jack = { input = "jack" }

