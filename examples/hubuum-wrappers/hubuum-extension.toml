schema_version = 1
name = "host"
version = "0.1.0"
requires_cli = ">=0.0.9,<0.1.0"
protocol = "hubuum-cli.extension/v1"
executable = "hubuum-extension"

[[commands]]
path = ["show"]
arguments = ["host", "show"]
about = "Show a Host and its physical placement"
long_about = "Resolve a Host by name, ID, hostname, address, MAC address, or serial number, then show related Jacks and Rooms."
examples = [
  "extension host show server-01",
  "extension host show --verbose 00-11-22-33-44-55",
]

[[commands.options]]
name = "identifier"
kind = "string"
positional = true
help = "Host name, ID, address, MAC address, or serial number"

[[commands.options]]
name = "id"
kind = "string"
long = "id"
help = "Host identifier (alternative to the positional argument)"

[[commands.options]]
name = "verbose"
kind = "flag"
long = "verbose"
short = "v"
help = "Include every data leaf"

[[commands]]
path = ["create"]
arguments = ["host", "create"]
about = "Create a Host and optionally place it"
interactive = true
examples = [
  "extension host create --collection inventory server-01.example.org SERIAL123",
  "extension host create --collection inventory --to R-301 --jack J-42 server-01",
]

[[commands.options]]
name = "hostname"
kind = "string"
positional = true
help = "Host name or FQDN"

[[commands.options]]
name = "serial_argument"
kind = "string"
positional = true
help = "Hardware serial number"

[[commands.options]]
name = "serial"
kind = "string"
long = "serial"
help = "Hardware serial number"

[[commands.options]]
name = "name"
kind = "string"
long = "name"
help = "Hubuum object name"

[[commands.options]]
name = "fqdn"
kind = "string"
long = "fqdn"
help = "Canonical FQDN"

[[commands.options]]
name = "collection"
kind = "string"
long = "collection"
help = "Target collection"

[[commands.options]]
name = "description"
kind = "string"
long = "description"
help = "Object description"

[[commands.options]]
name = "ipv4"
kind = "string"
long = "ipv4"
help = "Default IPv4 address"

[[commands.options]]
name = "ipv6"
kind = "string"
long = "ipv6"
help = "Default IPv6 address"

[[commands.options]]
name = "no_dns"
kind = "flag"
long = "no-dns"
help = "Skip forward DNS lookup"

[[commands.options]]
name = "to"
kind = "string"
long = "to"
help = "Placement destination"

[[commands.options]]
name = "no_place"
kind = "flag"
long = "no-place"
help = "Leave the Host unplaced"

[[commands.options]]
name = "target_type"
kind = "string"
long = "target-type"
help = "Destination type"
values = ["auto", "host", "jack", "room"]

[[commands.options]]
name = "jack"
kind = "string"
long = "jack"
help = "Specific Jack when the destination is a Room"

[[commands.options]]
name = "mode"
kind = "string"
long = "mode"
help = "Behavior for an occupied Jack"
values = ["add", "switch"]

[[commands.options]]
name = "swap_with"
kind = "string"
long = "swap-with"
help = "Host to exchange with in switch mode"

[[commands.options]]
name = "yes"
kind = "flag"
long = "yes"
short = "y"
help = "Skip creation and move confirmations"

[[commands]]
path = ["move"]
arguments = ["host", "move"]
about = "Move a Host to a Jack, Room, or another Host's Jack"
interactive = true
examples = [
  "extension host move server-01 J-42",
  "extension host move --from server-01 --to R-301 --jack J-42",
  "extension host move server-01 J-42 --dry-run",
]

[[commands.options]]
name = "host"
kind = "string"
positional = true
help = "Host to move"

[[commands.options]]
name = "destination"
kind = "string"
positional = true
help = "Jack, Room, Host, or 'none'"

[[commands.options]]
name = "from"
kind = "string"
long = "from"
help = "Host to move (alternative to the positional argument)"

[[commands.options]]
name = "to"
kind = "string"
long = "to"
help = "Destination (alternative to the positional argument)"

[[commands.options]]
name = "target_type"
kind = "string"
long = "target-type"
help = "Destination type"
values = ["auto", "host", "jack", "room"]

[[commands.options]]
name = "jack"
kind = "string"
long = "jack"
help = "Specific Jack when the destination is a Room"

[[commands.options]]
name = "mode"
kind = "string"
long = "mode"
help = "Behavior for an occupied Jack"
values = ["add", "switch"]

[[commands.options]]
name = "swap_with"
kind = "string"
long = "swap-with"
help = "Host to exchange with in switch mode"

[[commands.options]]
name = "dry_run"
kind = "flag"
long = "dry-run"
help = "Show the relation plan without applying it"

[[commands.options]]
name = "yes"
kind = "flag"
long = "yes"
short = "y"
help = "Apply an unambiguous plan without confirmation"
