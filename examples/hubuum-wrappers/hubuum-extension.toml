schema_version = 1
kind = "executable"
name = "host"
version = "0.1.0"
requires_cli = ">=0.0.9,<0.1.0"
protocol = "hubuum-cli.extension/v1"
executable = "hubuum-extension"

[config.hosts_class]
type = "string"
default = "Hosts"

[config.jacks_class]
type = "string"
default = "Jacks"

[config.rooms_class]
type = "string"
default = "Rooms"

[config.host_collection]
type = "string"
default = "inventory"

[config.default_jack]
type = "string"
default = "J-000"

[commands.show]
path = ["show"]
arguments = ["host", "show"]
about = "Show a Host and its physical placement"
long_about = "Resolve a Host by name, ID, hostname, address, MAC address, or serial number, then show related Jacks and Rooms."
examples = [
  "extension host show server-01",
  "extension host show --verbose 00-11-22-33-44-55",
]

[commands.show.options.identifier]
kind = "string"
position = 1
help = "Host name, ID, address, MAC address, or serial number"

[commands.show.options.id]
kind = "string"
long = "id"
help = "Host identifier (alternative to the positional argument)"

[commands.show.options.verbose]
kind = "flag"
long = "verbose"
short = "v"
help = "Include every data leaf"

[commands.create]
path = ["create"]
arguments = ["host", "create"]
about = "Create a Host and optionally place it"
interactive = true
examples = [
  "extension host create --collection inventory server-01.example.org SERIAL123",
  "extension host create --collection inventory --to R-301 --jack J-42 server-01",
]

[commands.create.options.hostname]
kind = "string"
position = 1
help = "Host name or FQDN"

[commands.create.options.serial_argument]
kind = "string"
position = 2
help = "Hardware serial number"

[commands.create.options.serial]
kind = "string"
long = "serial"
help = "Hardware serial number"

[commands.create.options.name]
kind = "string"
long = "name"
help = "Hubuum object name"

[commands.create.options.fqdn]
kind = "string"
long = "fqdn"
help = "Canonical FQDN"

[commands.create.options.collection]
kind = "string"
long = "collection"
help = "Target collection"

[commands.create.options.description]
kind = "string"
long = "description"
help = "Object description"

[commands.create.options.ipv4]
kind = "string"
long = "ipv4"
help = "Default IPv4 address"

[commands.create.options.ipv6]
kind = "string"
long = "ipv6"
help = "Default IPv6 address"

[commands.create.options.no_dns]
kind = "flag"
long = "no-dns"
help = "Skip forward DNS lookup"

[commands.create.options.to]
kind = "string"
long = "to"
help = "Placement destination"

[commands.create.options.no_place]
kind = "flag"
long = "no-place"
help = "Leave the Host unplaced"

[commands.create.options.target_type]
kind = "string"
long = "target-type"
help = "Destination type"
values = ["auto", "host", "jack", "room"]

[commands.create.options.jack]
kind = "string"
long = "jack"
help = "Specific Jack when the destination is a Room"

[commands.create.options.mode]
kind = "string"
long = "mode"
help = "Behavior for an occupied Jack"
values = ["add", "switch"]

[commands.create.options.swap_with]
kind = "string"
long = "swap-with"
help = "Host to exchange with in switch mode"

[commands.create.options.yes]
kind = "flag"
long = "yes"
short = "y"
help = "Skip creation and move confirmations"

[commands.move]
path = ["move"]
arguments = ["host", "move"]
about = "Move a Host to a Jack, Room, or another Host's Jack"
interactive = true
examples = [
  "extension host move server-01 J-42",
  "extension host move --from server-01 --to R-301 --jack J-42",
  "extension host move server-01 J-42 --dry-run",
]

[commands.move.options.host]
kind = "string"
position = 1
help = "Host to move"

[commands.move.options.destination]
kind = "string"
position = 2
help = "Jack, Room, Host, or 'none'"

[commands.move.options.from]
kind = "string"
long = "from"
help = "Host to move (alternative to the positional argument)"

[commands.move.options.to]
kind = "string"
long = "to"
help = "Destination (alternative to the positional argument)"

[commands.move.options.target_type]
kind = "string"
long = "target-type"
help = "Destination type"
values = ["auto", "host", "jack", "room"]

[commands.move.options.jack]
kind = "string"
long = "jack"
help = "Specific Jack when the destination is a Room"

[commands.move.options.mode]
kind = "string"
long = "mode"
help = "Behavior for an occupied Jack"
values = ["add", "switch"]

[commands.move.options.swap_with]
kind = "string"
long = "swap-with"
help = "Host to exchange with in switch mode"

[commands.move.options.dry_run]
kind = "flag"
long = "dry-run"
help = "Show the relation plan without applying it"

[commands.move.options.yes]
kind = "flag"
long = "yes"
short = "y"
help = "Apply an unambiguous plan without confirmation"
