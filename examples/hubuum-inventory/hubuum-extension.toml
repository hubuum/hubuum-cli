schema_version = 1
name = "inventory"
version = "0.1.0"
requires_cli = ">=0.0.9,<0.1.0"
protocol = "hubuum-cli.extension/v1"

[[commands]]
path = ["snapshot"]
about = "Collect Hosts, Jacks, and Rooms in one response"
long_about = "Run three built-in object list commands in-process and compose their semantic JSON output."
examples = [
  "extension inventory snapshot",
  "extension inventory snapshot --output json",
  "extension inventory snapshot | JQ '.hosts | length'",
]

[commands.workflow]
result = "{ hosts: .steps.hosts, jacks: .steps.jacks, rooms: .steps.rooms }"

[[commands.workflow.steps]]
id = "hosts"
run = ["object", "list"]

[commands.workflow.steps.with]
class = { config = "hosts_class", default = "Hosts" }
all = true

[[commands.workflow.steps]]
id = "jacks"
run = ["object", "list"]

[commands.workflow.steps.with]
class = { config = "jacks_class", default = "Jacks" }
all = true

[[commands.workflow.steps]]
id = "rooms"
run = ["object", "list"]

[commands.workflow.steps.with]
class = { config = "rooms_class", default = "Rooms" }
all = true

[[commands]]
path = ["classes"]
about = "List all classes through an in-process step"
examples = ["extension inventory classes --output json"]

[commands.workflow]

[[commands.workflow.steps]]
id = "classes"
run = ["class", "list"]

[commands.workflow.steps.with]
all = true
