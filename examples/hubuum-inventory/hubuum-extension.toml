schema_version = 1
kind = "portable"
name = "inventory"
version = "0.1.0"
requires_cli = ">=0.0.9,<0.1.0"

[config.hosts_class]
type = "string"
default = "Hosts"
help = "Class containing Host objects"

[config.jacks_class]
type = "string"
default = "Jacks"
help = "Class containing Jack objects"

[config.rooms_class]
type = "string"
default = "Rooms"
help = "Class containing Room objects"

[workflows.snapshot]
step_order = [
  "hosts",
  "jacks",
  "rooms",
]
result = "{ hosts: .steps.hosts, jacks: .steps.jacks, rooms: .steps.rooms }"

[workflows.snapshot.output]
shape = "detail"
type = "json"
columns = ["hosts", "jacks", "rooms"]

[workflows.snapshot.steps.hosts]
kind = "run"
run = ["object", "list"]

[workflows.snapshot.steps.hosts.with]
class = { config = "hosts_class" }
all = true

[workflows.snapshot.steps.jacks]
kind = "run"
run = ["object", "list"]

[workflows.snapshot.steps.jacks.with]
class = { config = "jacks_class" }
all = true

[workflows.snapshot.steps.rooms]
kind = "run"
run = ["object", "list"]

[workflows.snapshot.steps.rooms.with]
class = { config = "rooms_class" }
all = true

[workflows.classes]
step_order = [
  "classes",
]
result = ".steps.classes"

[workflows.classes.output]
shape = "rows"
type = "json"

[workflows.classes.steps.classes]
kind = "run"
run = ["class", "list"]

[workflows.classes.steps.classes.with]
all = true

[commands.snapshot]
path = ["snapshot"]
workflow = "snapshot"
about = "Collect Hosts, Jacks, and Rooms in one response"
long_about = "Run three built-in object list commands in-process and compose their semantic JSON output."
examples = [
  "extension inventory snapshot",
  "extension inventory snapshot --output json",
  "extension inventory snapshot | JQ '.hosts | length'",
]

[commands.classes]
path = ["classes"]
workflow = "classes"
about = "List all classes through an in-process step"
examples = ["extension inventory classes --output json"]
