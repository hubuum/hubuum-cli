[package]
name = "hubuum-cli"
version = "0.0.20"
edition = "2021"

[workspace]
members = [
    "cli_command_derive",
    "crates/hubuum-extension-protocol",
    "crates/hubuum-filter",
    "crates/hubuum-search",
    "crates/hubuum-query",
    "crates/hubuum-session",
    "crates/hubuum-theme",
    "crates/hubuum-update",
]
resolver = "2"

[workspace.dependencies]
hubuum_client = { version = "=0.19.0", default-features = false, features = ["blocking"] }

[package.metadata.hubuum]
server-version = "0.0.20"
server-image = "ghcr.io/hubuum/hubuum-server@sha256:eaf59f8a4b4793030a78bc1637a8e2b9fad2f810b8621ff9a874dca534b9a23a"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
cli_command_derive = { path = "./cli_command_derive" }
hubuum-filter = { path = "./crates/hubuum-filter" }
hubuum-search = { path = "./crates/hubuum-search" }
hubuum-query = { path = "./crates/hubuum-query" }
hubuum-session = { path = "./crates/hubuum-session" }
hubuum-extension-protocol = { path = "./crates/hubuum-extension-protocol" }
hubuum-theme = { path = "./crates/hubuum-theme" }
hubuum-update = { path = "./crates/hubuum-update" }
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0", features = ["fmt", "env-filter"] }
log = "0"
shlex = "2"
anstream = "1"
anstyle = "1"
reqwest = { version = "0", default-features = false, features = ["blocking", "json", "rustls"] }
chrono = { version = "0", features = ["serde"] }
once_cell = "1"
regex = "1"
dirs = "7"
config = "0"
clap = { version = "4", features = ["derive", "env"] }
hubuum_client = { workspace = true }
rpassword = "7"
rand = "0"
jqesque = "0.1"
json-patch = "4"
jsonpath-rust = "1"
smooth-json = "0"
serial_test = "4.0"
strum = { version = "0.28", features = ["derive", "strum_macros"] }
async-trait = "0.1"
reedline = "0.52"
tokio = { version = "1", features = [
    "fs",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
] }
comfy-table = "8"
crossterm = "0.29"
toml = "1"
tempfile = "3"
[target.'cfg(target_os = "linux")'.dev-dependencies]
dbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[dev-dependencies]
keyring-core = "=1.0.1"
assert_cmd = "2"
portable-pty = "0.9"
predicates = "3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
