[package]
name = "hubuum-cli"
version = "0.0.10"
edition = "2021"

[workspace]
members = [
    "cli_command_derive",
    "crates/hubuum-extension-protocol",
    "crates/hubuum-filter",
    "crates/hubuum-theme",
]
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
cli_command_derive = { path = "./cli_command_derive" }
hubuum-filter = { path = "./crates/hubuum-filter" }
hubuum-extension-protocol = { path = "./crates/hubuum-extension-protocol" }
hubuum-theme = { path = "./crates/hubuum-theme" }
thiserror = "2"
tracing-subscriber = { version = "0", features = ["fmt", "env-filter"] }
log = "0"
shlex = "2"
anstream = "1"
anstyle = "1"
reqwest = { version = "0", default-features = false, features = ["blocking", "json", "rustls"] }
chrono = { version = "0", features = ["serde"] }
once_cell = "1"
regex = "1"
dirs = "6"
config = "0"
clap = { version = "4", features = ["derive", "env"] }
hubuum_client = { version = "=0.9.1", default-features = false, features = ["blocking"] }
rpassword = "7"
rand = "0"
jqesque = "0.0.3"
json-patch = "4"
jsonpath-rust = "1"
smooth-json = "0"
serial_test = "4.0"
strum = { version = "0.28", features = ["derive", "strum_macros"] }
async-trait = "0.1"
reedline = "0.51"
tokio = { version = "1", features = [
    "fs",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
] }
comfy-table = "8"
crossterm = "0.29"
toml = "1"

[dev-dependencies]
assert_cmd = "2"
portable-pty = "0.9"
predicates = "3"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[patch.crates-io]
# jqesque 0.0.3 passes jsonptr values into json-patch 4.2, so Cargo.lock keeps
# both crates on jsonptr 0.7.1 until their upstream constraints converge.
