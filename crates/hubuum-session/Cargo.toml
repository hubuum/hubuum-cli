[package]
name = "hubuum-session"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Identity-scoped persistent Hubuum sessions with process-safe file and keychain storage"

[dependencies]
hubuum_client = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
keyring-core = "=1.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[dev-dependencies]
chrono = "0"
