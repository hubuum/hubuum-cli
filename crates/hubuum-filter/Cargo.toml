[package]
name = "hubuum-filter"
version = "0.1.0"
edition = "2021"
description = "Reusable semantic JSON pipeline parser and evaluator"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hubuum/hubuum-cli"
homepage = "https://github.com/hubuum/hubuum-cli"
documentation = "https://docs.rs/hubuum-filter"
keywords = ["json", "pipeline", "filter", "cli", "jq"]
categories = ["command-line-interface", "parser-implementations"]

[dependencies]
chrono = "0.4"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
thiserror = "2"
jaq-all = "0.3.0"
