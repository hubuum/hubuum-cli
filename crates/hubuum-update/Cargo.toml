[package]
name = "hubuum-update"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Verified updates from official Hubuum CLI releases"

[dependencies]
self_update = { version = "1.3", default-features = false, features = ["reqwest", "rustls", "github", "compression-tar-gz", "compression-zip-deflate", "checksums"] }
semver = "1"
thiserror = "2"

[dev-dependencies]
flate2 = "1"
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
